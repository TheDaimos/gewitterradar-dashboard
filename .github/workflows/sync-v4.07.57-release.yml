# Retry from the final release branch head; do not mutate this branch until staging completes.
name: Stage Dashboard V4.07.57 release

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/sync-v4.07.57-release.yml'

permissions:
  contents: write

env:
  CANONICAL_REPOSITORY: TheDaimos/gewitterradar
  CANONICAL_SHA: 3f3f3c1a574db529d3ac623681fdec4298b26605
  FRONTEND_SHA256: ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571
  FRONTEND_SIZE: '1955144'
  LOCALE_SHA256: 997c4fe9b357935888fdb7bedc43cdd17f105b97241a000324891cea575dd436
  PACKAGE_SHA256: 1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact canonical V4.07.57 commit
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/canonical-v40757"
          mkdir -p "$tmp"
          curl -fL --retry 3 "https://github.com/${CANONICAL_REPOSITORY}/archive/${CANONICAL_SHA}.zip" -o "$tmp/canonical.zip"
          unzip -q "$tmp/canonical.zip" -d "$tmp"
          src="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -name 'gewitterradar-*' | head -n1)"
          test -n "$src"
          echo "CANONICAL_SOURCE=$src" >> "$GITHUB_ENV"

      - name: Verify canonical payload identity
        shell: bash
        run: |
          set -euo pipefail
          src="$CANONICAL_SOURCE"
          test "$(stat -c%s "$src/dashboard/dist/gewitterradar.js")" = "$FRONTEND_SIZE"
          echo "$FRONTEND_SHA256  $src/dashboard/dist/gewitterradar.js" | sha256sum -c -
          echo "$LOCALE_SHA256  $src/dashboard/dist/locales/about-locales.js" | sha256sum -c -
          echo "$PACKAGE_SHA256  $src/dashboard/dist/app_gewitterradar_v4_07_pkg.yaml" | sha256sum -c -
          cmp "$src/frontend/gewitterradar.js" "$src/dashboard/dist/gewitterradar.js"
          grep -Fq "const CARD_VERSION = '4.07.57';" "$src/dashboard/dist/gewitterradar.js"
          grep -Fq 'V4.07-RELEASE57-2026-09-16' "$src/dashboard/dist/gewitterradar.js"

      - name: Synchronize exact Dashboard payload and release docs
        shell: bash
        run: |
          set -euo pipefail
          src="$CANONICAL_SOURCE"
          rm -rf dist
          cp -a "$src/dashboard/dist" dist
          cp "$src/docs/RELEASE_NOTES_V4_07_57.md" RELEASE_NOTES_V4_07_57.md
          cp "$src/docs/HISTORY.md" docs/HISTORY.md
          cp "$src/docs/MILESTONES.md" docs/MILESTONES.md
          cp "$src/docs/RELEASE_PROCESS.md" docs/RELEASE_PROCESS.md
          cp "$src/docs/RECORDER.md" docs/RECORDER.md
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Update Dashboard-facing documentation to V4.07.57
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old_sha='249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a'
          new_sha='ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571'
          canonical='3f3f3c1a574db529d3ac623681fdec4298b26605'

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('Gewitterradar-V4.07.56-c9a45b','Gewitterradar-V4.07.57-c9a45b')
          s=s.replace('Public%20Stable-V4.06-lightgrey','Public%20Stable-V4.07.57-lightgrey')
          s=s.replace('RELEASE_NOTES_V4_07_56.md">RELEASE_NOTES_V4_07_56.md','RELEASE_NOTES_V4_07_57.md">RELEASE_NOTES_V4_07_57.md')
          s=s.replace('Stabile öffentliche Basis: **V4.06**  \nAktuell vorbereiteter Dashboard-Kandidat: **V4.07.56**','Aktueller öffentlicher Dashboard-Stand: **V4.07.57**')
          s=s.replace('Akzeptierte V4.07.56-Payload-Identitäten:','V4.07.57-Payload-Identitäten:')
          s=s.replace(old_sha,new_sha)
          s=s.replace('Veröffentlichte Tags und eingefrorene Release-Branches bleiben unverändert. V4.05 und V4.06 werden durch die V4.07.56-Vorbereitung nicht rückwirkend verändert.','V4.07.57 ist aus dem exakt veröffentlichten kanonischen Gewitterradar-Commit abgeleitet. Frühere Tags und eingefrorene Release-Branches bleiben unverändert.')
          marker='Dieses Repository ist die abgeleitete Dashboard-/HACS-Auslieferung des kanonischen Gewitterradar-Projekts:\n\n```text\nTheDaimos/gewitterradar\n```'
          if marker in s:
              s=s.replace(marker,marker+f'\n\nKanonischer V4.07.57-Commit: `{canonical}`')
          p.write_text(s,encoding='utf-8')

          for name in ['docs/INSTALLATION_DE.md','docs/INSTALLATION_EN.md']:
              p=Path(name); t=p.read_text(encoding='utf-8')
              t=t.replace('V4.07.56','V4.07.57').replace(old_sha,new_sha)
              p.write_text(t,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          header='# Changelog\n\n'
          entry=f'''## V4.07.57 · 2026/09 — public Dashboard release\n\n- Derived the Dashboard/HACS payload byte-for-byte from canonical Gewitterradar commit `{canonical}`.\n- Frontend SHA256: `{new_sha}`.\n- External locale SHA256: `997c4fe9b357935888fdb7bedc43cdd17f105b97241a000324891cea575dd436`.\n- V4.07 package SHA256: `1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694`.\n- Publishes the rewritten Dashboard installation documentation and the same V4.07.57 version/build metadata as the canonical product release.\n- Runtime behavior remains the protected V4.07.56 baseline; no Dashboard product logic was changed for this documentation/install patch.\n\n'''
          if not s.startswith(header): raise SystemExit('CHANGELOG header changed')
          if '## V4.07.57 · 2026/09' not in s: s=header+entry+s[len(header):]
          s=s.replace('- Public V4.06 remains the current release until V4.07.56 is explicitly published; earlier tags and frozen branches remain immutable.','- V4.07.56 remains preserved as the protected runtime/diagnostic baseline; earlier tags and frozen branches remain immutable.')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add Dashboard release marker
        shell: bash
        run: |
          mkdir -p docs/archive-triggers
          cat > docs/archive-triggers/V4_07_57_PUBLISH.trigger <<'EOF'
          VERSION=V4.07.57
          CANONICAL_SHA=3f3f3c1a574db529d3ac623681fdec4298b26605
          FRONTEND_SHA256=ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571
          FRONTEND_SIZE=1955144
          EOF

      - name: Verify staged Dashboard release
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/gewitterradar.js
          test "$(stat -c%s dist/gewitterradar.js)" = "$FRONTEND_SIZE"
          echo "$FRONTEND_SHA256  dist/gewitterradar.js" | sha256sum -c -
          echo "$LOCALE_SHA256  dist/locales/about-locales.js" | sha256sum -c -
          echo "$PACKAGE_SHA256  dist/app_gewitterradar_v4_07_pkg.yaml" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
          test -f RELEASE_NOTES_V4_07_57.md

      - name: HACS Dashboard validation
        uses: hacs/action@main
        with:
          category: plugin
          ignore: license images

      - name: Commit staged V4.07.57 release payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md RELEASE_NOTES_V4_07_57.md SHA256SUMS.txt dist docs
          if git diff --cached --quiet; then
            echo 'Dashboard V4.07.57 payload already staged.'
            exit 0
          fi
          git commit -m 'release: stage Dashboard V4.07.57 payload'
          git push origin HEAD:release/v4.07.57
