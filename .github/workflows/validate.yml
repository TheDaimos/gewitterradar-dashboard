name: Validate HACS Dashboard V4.08

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V4.05 remains untouched
        run: |
          set -euo pipefail
          expected="44a3a615f76a7d865c2d6c8690728656c18577b9"
          test "$(git rev-parse 'refs/tags/v4.05^{commit}')" = "${expected}"
          test "$(git rev-parse 'refs/remotes/origin/frozen/v4.05^{commit}')" = "${expected}"

      - name: Verify exact derived V4.08 distribution
        run: |
          set -euo pipefail
          node --check dist/gewitterradar.js
          test "$(stat -c%s dist/gewitterradar.js)" = "2028645"
          echo "b75390652fae4aa98c77162fb207d97ece408ab617bbf107bcb0f3b9466a691f  dist/gewitterradar.js" | sha256sum -c -
          echo "a57493b6291671696aeb87c267595e3ce5fede987546f702d7883ef6f07bd288  dist/locales/about-locales.js" | sha256sum -c -
          echo "1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694  dist/app_gewitterradar_v4_07_pkg.yaml" | sha256sum -c -
          test -f dist/app_gewitterradar_v4_06_pkg.yaml
          test -f RELEASE_NOTES_V4_08.md
          test -f dist/assets/gewitterradar-about-close-premium.webp
          test -f dist/assets/gewitterradar-about-copy-scroll.webp
          test ! -e dist/app_gewitterradar_pkg.yaml
          grep -Fq "const CARD_VERSION = '4.08';" dist/gewitterradar.js
          grep -Fq 'V4.08-RELEASE-2026-09-18' dist/gewitterradar.js
          sha256sum -c SHA256SUMS.txt

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: license images
