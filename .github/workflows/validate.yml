name: Validate HACS Dashboard V4.07.57

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V4.05 remains untouched
        run: |
          set -euo pipefail
          expected="44a3a615f76a7d865c2d6c8690728656c18577b9"
          test "$(git rev-parse 'refs/tags/v4.05^{commit}')" = "${expected}"
          test "$(git rev-parse 'refs/remotes/origin/frozen/v4.05^{commit}')" = "${expected}"

      - name: Verify exact derived V4.07.57 distribution
        run: |
          set -euo pipefail
          node --check dist/gewitterradar.js
          test "$(stat -c%s dist/gewitterradar.js)" = "1955144"
          echo "ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571  dist/gewitterradar.js" | sha256sum -c -
          echo "997c4fe9b357935888fdb7bedc43cdd17f105b97241a000324891cea575dd436  dist/locales/about-locales.js" | sha256sum -c -
          echo "1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694  dist/app_gewitterradar_v4_07_pkg.yaml" | sha256sum -c -
          test -f dist/app_gewitterradar_v4_06_pkg.yaml
          test -f RELEASE_NOTES_V4_07_57.md
          test -f dist/assets/gewitterradar-about-close-premium.webp
          test -f dist/assets/gewitterradar-about-copy-scroll.webp
          test ! -e dist/app_gewitterradar_pkg.yaml
          grep -Fq "const CARD_VERSION = '4.07.57';" dist/gewitterradar.js
          grep -Fq 'V4.07-RELEASE57-2026-09-16' dist/gewitterradar.js
          sha256sum -c SHA256SUMS.txt

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: license images
