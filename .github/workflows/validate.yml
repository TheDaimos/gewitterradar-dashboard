name: Validate HACS Dashboard V4.06

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen V4.05 remains untouched
        run: |
          set -euo pipefail
          expected="44a3a615f76a7d865c2d6c8690728656c18577b9"
          test "$(git rev-parse 'refs/tags/v4.05^{commit}')" = "${expected}"
          test "$(git rev-parse 'refs/remotes/origin/frozen/v4.05^{commit}')" = "${expected}"
      - name: Verify V4.06 distribution
        run: |
          set -euo pipefail
          node --check dist/gewitterradar.js
          echo "599ab9f0035b979c0932f5f02f1c40bf0e11d36e6093d7f1a1067b8cb24d71ee  dist/gewitterradar.js" | sha256sum -c -
          test -f dist/locales/about-locales.js
          test -f dist/app_gewitterradar_v4_06_pkg.yaml
          test -f dist/assets/gewitterradar-about-close-premium.webp
          test -f dist/assets/gewitterradar-about-copy-scroll.webp
          test ! -e dist/app_gewitterradar_pkg.yaml
          grep -Fq '${BUILD_YYYY_MM} · V${CARD_VERSION} · Gewitterradar · by CK' dist/gewitterradar.js
          grep -Fq "V4.05 · 2026/09" dist/gewitterradar.js
          grep -Fq "V4.07 · PLANNED" dist/gewitterradar.js
          sha256sum -c SHA256SUMS.txt

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: license images
