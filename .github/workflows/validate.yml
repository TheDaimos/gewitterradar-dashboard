name: Validate HACS Dashboard V4.10

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen V4.05 remains untouched
        run: |
          set -euo pipefail
          expected="44a3a615f76a7d865c2d6c8690728656c18577b9"
          test "$(git rev-parse 'refs/tags/v4.05^{commit}')" = "${expected}"
          test "$(git rev-parse 'refs/remotes/origin/frozen/v4.05^{commit}')" = "${expected}"

      - name: Verify exact derived V4.10 distribution
        run: |
          set -euo pipefail
          node --check dist/gewitterradar.js
          test "$(stat -c%s dist/gewitterradar.js)" = "8739"
          echo "62f692b07e1bda236b956d9254215da0762396e67606297cfa52e6c26b20704e  dist/gewitterradar.js" | sha256sum -c -
          echo "dc6506291dd4cfe75e3b9c829fb42f21062511fb574d335af438e6c42711802e  dist/locales/about-locales.js" | sha256sum -c -
          echo "1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694  dist/app_gewitterradar_v4_07_pkg.yaml" | sha256sum -c -
          test -f dist/app_gewitterradar_v4_06_pkg.yaml
          test -f RELEASE_NOTES_V4_10.md
          test -f dist/assets/gewitterradar-about-close-premium.webp
          test -f dist/assets/gewitterradar-about-copy-scroll.webp
          test -f dist/assets/gewitterradar-compass-toggle.png
          test -f dist/module-manifest.js
          test -f dist/assets/gewitterradar-runtime-manifest.json
          test ! -e dist/app_gewitterradar_pkg.yaml
          grep -Fq "const CARD_VERSION = '4.10';" dist/gewitterradar.js
          grep -Fq 'V4.10-RELEASE-2026-09-30' dist/gewitterradar.js
          sha256sum -c SHA256SUMS.txt

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: license images
